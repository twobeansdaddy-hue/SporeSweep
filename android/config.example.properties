# 이 파일을 config.properties로 복사해서 자기 값을 적는다. config.properties는 저장소에 올리지 않는다.
# 적지 않으면 구글이 공개한 시험용 ID를 쓴다.
# ADMOB_APP_ID=ca-app-pub-0000000000000000~0000000000
# REWARDED_AD_UNIT_ID=ca-app-pub-0000000000000000/0000000000

# 출시용 업로드 키 파일. 비밀번호는 맥 키체인(서비스 이름 sporesweep-upload-key)이나 환경 변수 UPLOAD_KEY_PASSWORD에 둔다.
# UPLOAD_KEYSTORE=~/Developer/keys/sporesweep-upload.jks
# UPLOAD_KEY_ALIAS=upload
